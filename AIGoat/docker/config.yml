# Safe workshop defaults. Secrets are injected through docker/.env and never stored here.
app:
  name: "AI Goat - AIET Workshop"
  debug: false
  secret_key: "overridden-by-APP_SECRET_KEY"
  allowed_origins: ["http://localhost:3000", "http://127.0.0.1:3000"]
  media_dir: "./media"

database:
  url: "sqlite+aiosqlite:////app/data/aigoat.db"

ollama:
  # Retained for local-development compatibility. Workshop Compose uses NVIDIA hosted inference.
  base_url: "http://ollama:11434"
  model: "mistral"
  agent_model: null
  timeout: 120

defense:
  level: 0
  l1_confidence_threshold: 0.6
  l2_confidence_threshold: 0.3
  profiles_path: "/app/config/defense_profiles.yml"

rag:
  enabled: true
  embedding_model: "all-MiniLM-L6-v2"
  chroma_path: "/app/data/chroma_db"
  top_k: 5
  chunk_size: 512
  max_context_tokens: 1500
  hybrid: false
  rrf_k: 60
  reranker: null
  provenance: true

chat:
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  max_tokens: 2048

features:
  admin_dashboard: true
  coupon_system: true
  knowledge_base: true

taxonomy:
  frameworks_path: "/app/config/frameworks"
  labs_path: "/app/config/labs"

surfaces:
  enabled: ["chat.cracky", "rag.kb", "api.raw", "agent.runner", "mcp.client"]

agent:
  max_steps: 8
  require_approval_at_level: 2

mcp:
  registry_path: "/app/config/mcp_servers.yml"
  spawn_timeout: 15
  max_concurrent: 2
