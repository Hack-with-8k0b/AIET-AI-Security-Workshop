# AIET workshop: distroless backend + nginx frontend, NVIDIA hosted models.
# From this directory: docker compose up --build -d
# App: http://HOST:3000
name: aigoat

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "8000"
    volumes:
      - ./config.yml:/app/config/config.yml:ro
      - db_data:/app/data
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config/config.yml
      LLM_PROVIDER: ${LLM_PROVIDER:-nvidia}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-nvidia}
      NVIDIA_EMBED_MODEL: ${NVIDIA_EMBED_MODEL:-nvidia/nv-embedqa-e5-v5}
      APP_DEBUG: "false"
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/python3.11",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/api/products/', timeout=5).raise_for_status()",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${HOST_BIND:-0.0.0.0}:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
