# Workshop deployment: hosted NVIDIA inference, no Ollama container/model download.
# Default is loopback-only. For a controlled classroom LAN, set HOST_BIND in docker/.env
# to the instructor machine's LAN IP and firewall TCP/3000 to the student subnet only.
name: aigoat

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    expose:
      - "8000"
    volumes:
      - ./config.yml:/app/config/config.yml:ro
      - ../prompts:/app/prompts:ro
      - ../media:/app/media:ro
      - ../guardrails:/app/guardrails:ro
      - db_data:/app/data
    environment:
      CONFIG_PATH: /app/config/config.yml
      LLM_PROVIDER: ${LLM_PROVIDER:-nvidia}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:?Set NVIDIA_API_KEY in docker/.env}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-nvidia/nemotron-3-ultra-550b-a55b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set a unique APP_SECRET_KEY in docker/.env}
      APP_DEBUG: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/products/', timeout=5).raise_for_status()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - target: 3000
        published: 3000
        host_ip: ${HOST_BIND:-127.0.0.1}
        protocol: tcp
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
