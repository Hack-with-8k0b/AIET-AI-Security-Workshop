# AIET workshop stack — matches local AIGoat (Ollama + MiniLM embeddings).
# From repo root:  .\Enable-Access.ps1
# Or from here:    docker compose up --build -d
#
# Default is CPU-safe (no NVIDIA reservation). For GPU acceleration:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Or set AIGOAT_GPU=auto|gpu|cpu and use deploy.sh / Enable-Access.ps1.
#
# First run pulls the Ollama model (~4.5 GB for mistral). Allocate 12 GB+ RAM
# in Docker Desktop. Create the model volume once:
#   docker volume create ollama_models
name: aigoat

services:
  ollama:
    image: ollama/ollama
    ports:
      - "${HOST_BIND:-0.0.0.0}:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${HOST_BIND:-0.0.0.0}:8000:8000"
    volumes:
      - ./config.yml:/app/config/config.yml
      - ../prompts:/app/prompts
      - ../media:/app/media
      - ../guardrails:/app/guardrails
      - db_data:/app/data
    env_file:
      - .env
    environment:
      CONFIG_PATH: /app/config/config.yml
      OLLAMA_BASE_URL: http://ollama:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      APP_DEBUG: "false"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import httpx; httpx.get('http://localhost:8000/api/products/', timeout=5).raise_for_status()",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${HOST_BIND:-0.0.0.0}:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  ollama_models:
    external: true
